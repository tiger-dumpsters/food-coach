<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Food Coach</title>
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16201b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Coach">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Signed out -->
  <section id="signin" class="signin" hidden>
    <div class="signin-inner">
      <div class="mark" aria-hidden="true">
        <img src="/icons/icon.svg" alt="" width="72" height="72">
      </div>
      <h1>Food Coach</h1>
      <p class="lede">Tell it what you ate. Ask it what to eat next. It keeps track, spots the gaps, and helps you stay full on real food.</p>
      <button id="signin-btn" class="btn primary">Continue with Google</button>
      <p class="fine">Private beta. Your log is visible only to you.</p>
      <p id="signin-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Signed in -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <h1 id="view-title">Coach</h1>
    </header>

    <!-- Chat -->
    <main id="view-chat" class="view chat-view">
      <div id="thread" class="thread" aria-live="polite"></div>
      <div class="composer-wrap">
        <div id="chips" class="chips">
          <button data-fill="Breakfast: ">Log breakfast</button>
          <button data-send="I'm hungry — what should I eat right now?">I'm hungry</button>
          <button data-fill="Workout: ">Log workout</button>
          <button data-send="How am I doing today?">How's today?</button>
          <button data-fill="Weighed in at " class="weight-only">Weigh in</button>
        </div>
        <form id="composer" class="composer" autocomplete="off">
          <textarea id="input" rows="1" placeholder="What did you eat? How was your workout?" aria-label="Message"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12l15-7-5 15-3-6-7-2z" fill="currentColor"/></svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Today -->
    <main id="view-today" class="view scroll" hidden>
      <div id="today" class="stack"></div>
    </main>

    <!-- Trends -->
    <main id="view-trends" class="view scroll" hidden>
      <div id="trends" class="stack"></div>
    </main>

    <!-- Settings -->
    <main id="view-settings" class="view scroll" hidden>
      <div id="settings" class="stack"></div>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button data-view="chat" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Coach</span>
      </button>
      <button data-view="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Today</span>
      </button>
      <button data-view="trends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Trends</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>You</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
