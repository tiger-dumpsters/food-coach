[build]
  publish = "public"
  functions = "netlify/functions"

# The Firebase *web* API key is a public identifier that must ship to the browser
# (access is controlled by Firestore rules), so exempt just that value from
# secrets scanning. Real secrets stay in Netlify env vars and are still scanned.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCWePmqjWQfbo5lb9UZd4qNJIVWv6sCCm4"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
