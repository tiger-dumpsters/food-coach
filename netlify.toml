[build]
  publish = "public"
  functions = "netlify/functions"

# The Firebase *web* API key is a public identifier that must ship to the browser
# (access is controlled by Firestore rules), so exempt just that value from
# secrets scanning. Real secrets stay in Netlify env vars and are still scanned.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCWePmqjWQfbo5lb9UZd4qNJIVWv6sCCm4"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "web-push"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The landing page lives at /, the app at /app.
# Old invite links (/?invite=CODE) still land in the app.
[[redirects]]
  from = "/"
  to = "/app?invite=:code"
  status = 302
  query = { invite = ":code" }

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/support"
  status = 301

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache"
